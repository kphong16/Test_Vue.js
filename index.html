<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Vue.js 시작하기</title>
  <script src="https://unpkg.com/vue@2.5.17"></script>
</head>

<body>
  <div id="app">
    <p>{{ items[0].name }}: {{ items[0].price }} x {{ items[0].quantity }}</p>
    <p> 필터 예제 {{1000 | numberWithDelimiter}}</p>
    <p> 합계(세미포함): {{ totalPrice | numberWithDelimiter }}원</p>
    <p> 합계(세  포함): {{ totalPriceWithTax | numberWithDelimiter }}원</p>
    <p v-show="!canBuy">
      {{ 1000 | numberWithDelimiter }}원 이상부터 구매 가능
    </p>
    <button id="b-button" v-bind:title="loggedInButton" v-bind:disabled="!canBuy">구매</button>
  </div>
  
  <script src="app.js">
  </script>
</body>
</html>
